services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: request_desk
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d request_desk"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      APP_NAME: Заявки
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:${APP_PORT:-8000}
      APP_LOCALE: ru
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: request_desk
      DB_USERNAME: app
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage
volumes:
  postgres-data:
  app-storage:
